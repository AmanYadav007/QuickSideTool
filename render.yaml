services:
  - type: web
    name: quicksidetool-backend
    env: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Stops glibc keeping a separate memory pool per gunicorn thread
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Turns on "Improve with AI" in the OCR scanner; Render asks for the value
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true

