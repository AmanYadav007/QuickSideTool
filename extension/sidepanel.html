<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Side Tool</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #021b1a; /* Rich Black, same as the site, so there's no white flash */
        --text: #f1f7f6;
        --muted: #aacbc4;
        --primary: #00df81;
        --on-primary: #021b1a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
      .status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        background: var(--bg);
      }
      .status[hidden] {
        display: none;
      }
      .status p {
        margin: 0;
        max-width: 280px;
        line-height: 1.5;
      }
      .status button {
        padding: 10px 20px;
        border: 0;
        border-radius: 9999px;
        font: 600 14px system-ui, sans-serif;
        color: var(--on-primary);
        background: var(--primary);
        cursor: pointer;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 223, 129, 0.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="status" class="status" role="status" aria-live="polite">
      <img src="icon48.png" alt="" width="40" height="40" />
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <p id="status-text">Loading your tools...</p>
      <button id="retry" type="button" hidden>Try again</button>
    </div>

    <!-- The tools are the website itself, so updates reach the extension
         without a new release. allow: camera for "Take photo" in the scanner,
         clipboard for "Copy text". -->
    <iframe
      id="app"
      title="Quick Side Tool"
      allow="camera; clipboard-read; clipboard-write; fullscreen"
    ></iframe>

    <script src="sidepanel.js"></script>
  </body>
</html>
